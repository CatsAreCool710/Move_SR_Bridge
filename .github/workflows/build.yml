name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build sr_helper.exe
        run: python scripts/build.py --yes
        env:
          PYINSTALLER_QUIET: 1

      - name: Create distribution zip
        run: |
          $staging = "${{ github.workspace }}/staging"
          New-Item -ItemType Directory -Force -Path $staging
          New-Item -ItemType Directory -Force -Path "$staging/Move_SR_Bridge"
          New-Item -ItemType Directory -Force -Path "$staging/scripts"

          Copy-Item "${{ github.workspace }}/Move_SR_Bridge/__init__.py","${{ github.workspace }}/Move_SR_Bridge/config.py","${{ github.workspace }}/Move_SR_Bridge/sr_bridge.py","${{ github.workspace }}/Move_SR_Bridge/sr_helper.py","${{ github.workspace }}/Move_SR_Bridge/sr_helper.exe","${{ github.workspace }}/Move_SR_Bridge/Tolk.dll","${{ github.workspace }}/Move_SR_Bridge/nvdaControllerClient64.dll" "$staging/Move_SR_Bridge/"
          Copy-Item "${{ github.workspace }}/scripts/install.bat","${{ github.workspace }}/scripts/install_from_source.bat","${{ github.workspace }}/scripts/uninstall.bat","${{ github.workspace }}/scripts/start_helper.bat","${{ github.workspace }}/scripts/build.py" "$staging/scripts/"
          Copy-Item "${{ github.workspace }}/README.md" "$staging/"
          Copy-Item "${{ github.workspace }}/LICENSE" "$staging/"

          Compress-Archive -Path "$staging/*" -DestinationPath "${{ github.workspace }}/Move-SR-Bridge.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Move-SR-Bridge.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build sr_helper_mac
        run: python scripts/build_mac.py --yes
        env:
          PYINSTALLER_QUIET: 1

      - name: Build graphical installer
        run: osacompile -l JavaScript -o "Install Move-SR-Bridge.app" "scripts/installer/mac/Install Move-SR-Bridge.js"

      - name: Create distribution zip
        run: |
          staging="${{ github.workspace }}/staging"
          mkdir -p "$staging"

          mkdir -p "$staging/Move_SR_Bridge"
          cp Move_SR_Bridge/__init__.py Move_SR_Bridge/config.py Move_SR_Bridge/sr_bridge.py \
             Move_SR_Bridge/sr_helper.py Move_SR_Bridge/sr_helper_mac \
             "$staging/Move_SR_Bridge/"

          mkdir -p "$staging/scripts/installer/mac"
          cp scripts/install_mac.sh scripts/uninstall_mac.sh scripts/start_helper_mac.sh \
             scripts/build_mac.py scripts/release_mac.sh \
             "$staging/scripts/"
          cp scripts/installer/mac/build.sh "scripts/installer/mac/Install Move-SR-Bridge.js" \
             "$staging/scripts/installer/mac/"

          cp -R "Install Move-SR-Bridge.app" "$staging/"
          cp README.md LICENSE "$staging/"

          ditto -c -k --sequesterRsrc --keepParent "$staging" Move-SR-Bridge-macOS.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Move-SR-Bridge-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
